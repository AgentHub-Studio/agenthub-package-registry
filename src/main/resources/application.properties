# Application
spring.application.name=agenthub-package-registry
server.port=8084

# Logging
logging.level.root=INFO
logging.level.dev.cezar.agenthub.packageregistry=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# PostgreSQL datasource (Flyway)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgres.internal:5432/agenthub
spring.datasource.username=postgres
spring.datasource.password=postgres

# PostgreSQL R2DBC (reactive)
spring.r2dbc.url=r2dbc:postgresql://postgres.internal:5432/agenthub
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.placeholder-replacement=false
spring.flyway.locations=classpath:db/migrations/public,classpath:db/migrations/schemas

# MinIO (package artifact storage)
agenthub.storage.s3.endpoint=http://minio.internal:9000
agenthub.storage.s3.access-key=admin
agenthub.storage.s3.secret-key=password
agenthub.storage.s3.bucket=agenthub

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Keycloak (JWT)
agenthub.keycloak.base-url=http://keycloak.internal:8080
agenthub.keycloak.jwks-uri-template=http://keycloak.internal:8080/realms/{tenantId}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak.internal:8080/realms/agenthub
